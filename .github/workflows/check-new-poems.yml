name: Check New Poems & Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-new-poems:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    concurrency:
      group: check-new-poems
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Decode Firebase service account
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" | base64 --decode > /tmp/veil-firebase-sa.json
          test -s /tmp/veil-firebase-sa.json

      - name: Check for new poems and push
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/veil-firebase-sa.json
        run: node check-new-poems.js